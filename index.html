    <meta property="og:site_name" content="Quillbench" />

      property="og:description"
      content="Your book cover, designed for you by Sarah: $99. Want the whole launch done? Studio Bundle $449 for the first 10 authors, then $499."
    />
    <meta property="og:url" content="https://quillbench.netlify.app/" />
    <meta property="og:image" content="https://quillbench.netlify.app/og-home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Quillbench: your book cover, designed for you. Shows the Eden's Fall front cover, designed by Sarah." />
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Your book cover, designed for you by Sarah: $99. Want the whole launch done? Studio Bundle $449 for the first 10 authors, then $499."
    />
    <meta name="twitter:image" content="https://quillbench.netlify.app/og-home.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,560;0,9..144,680;1,9..144,400&family=Figtree:wght@400;500;600;650&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap"
      rel="stylesheet"
    />
      <script defer src="/js/qb-count.js"></script>
  </head>
  <body>
    <!-- Thin static crawler copy (outside React root) -->
    <p id="qb-crawler" aria-hidden="true" style="position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden">
      Quillbench: book covers and launch kits for indie authors, designed by Sarah.
      <a href="/pricing/cover">Cover Design, $99</a>: ebook front cover, 2400x2400 audiobook cover, and a 3D book mockup.
      Want the whole launch done? <a href="/pricing/bundle">Studio Bundle</a>.
      <a href="/tools/cover-brief/">Free Cover Brief tool</a>. Free Quillbench writing app.
      <a href="/waitlist">Join the waitlist</a>.
    </p>
    <!-- Netlify Forms detection (SPA): enable notifications in Netlify → Forms → quillbench-waitlist -->
    <form name="quillbench-waitlist" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
      <input type="text" name="source" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
