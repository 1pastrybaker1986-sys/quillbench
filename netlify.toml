[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = false

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = false

[[redirects]]
  from = "/og-image.png"
  to = "/og-image.png"
  status = 200
  force = false

[[redirects]]
  from = "/waitlist.html"
  to = "/waitlist.html"
  status = 200
  force = false

[[redirects]]
  from = "/waitlist"
  to = "/waitlist/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/waitlist/"
  to = "/waitlist/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/pricing/bundle"
  to = "/pricing/bundle/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/pricing/bundle/"
  to = "/pricing/bundle/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/pricing"
  to = "/pricing/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/pricing/"
  to = "/pricing/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
