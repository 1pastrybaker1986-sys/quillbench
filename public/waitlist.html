<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#F7F1EA" />
    <meta name="robots" content="noindex" />
    <title>Quillbench | You’re on the waitlist</title>
    <style>
      html,body{background:#F7F1EA;color:#1C1917;color-scheme:light only}
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        max-width: 28rem;
        margin: 3rem auto;
        padding: 0 1.25rem;
        line-height: 1.5;
      }
      a { color: #b86a62; }
      .btn {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.85rem 1.25rem;
        border-radius: 0.65rem;
        background: #1c1917;
        color: #f7f1ea;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>You’re on the list</h1>
    <p>
      Thanks for joining the Quillbench soft-launch waitlist. We’ll be in touch
      at the email you shared.
    </p>
    <p>Ready now? Soft-launch Studio Bundle is <strong>$449</strong> USD.</p>
    <p><a class="btn" href="/pricing/bundle">Get Studio Bundle $449</a></p>
    <p><a href="/">Back to Quillbench</a></p>

    <!-- Netlify Forms: real static form (SPA POST target). Detection also in index.html. -->
    <form
      name="quillbench-waitlist"
      method="POST"
      data-netlify="true"
      netlify
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="quillbench-waitlist" />
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
      <input type="text" name="source" />
    </form>
  </body>
</html>
