<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quillbench waitlist</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        max-width: 28rem;
        margin: 3rem auto;
        padding: 0 1.25rem;
        line-height: 1.5;
        color: #2a2426;
      }
      a { color: #d45f6c; }
    </style>
  </head>
  <body>
    <h1>You’re on the list</h1>
    <p>
      Thanks for joining the Quillbench soft-launch waitlist. We’ll be in touch
      at the email you shared.
    </p>
    <p><a href="/">Back to Quillbench</a></p>

    <!-- Netlify Forms: real static form (SPA POST target). Detection also in index.html. -->
    <form
      name="quillbench-waitlist"
      method="POST"
      data-netlify="true"
      netlify
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="quillbench-waitlist" />
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
      <input type="text" name="source" />
    </form>

    <script>
      // Optional: send humans who land here back to the app after a beat
      if (typeof location !== "undefined" && !location.search.includes("no-redirect")) {
        setTimeout(function () {
          location.replace("/");
        }, 2500);
      }
    </script>
  </body>
</html>
