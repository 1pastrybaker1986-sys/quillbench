<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#F7F1EA" />
    <meta name="description" content="You’re on the Quillbench waitlist. Ready now? Get Studio Bundle for $449." />
    <meta property="og:title" content="Quillbench waitlist" />
    <meta property="og:description" content="You’re on the list. Get Studio Bundle $449 when you’re ready." />
    <meta property="og:image" content="https://quillbench.netlify.app/og-image.png" />
    <meta property="og:url" content="https://quillbench.netlify.app/waitlist" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Quillbench | You’re on the waitlist</title>
    <style>
      html,body{background:#F7F1EA;color:#1C1917;color-scheme:light only;margin:0}
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:28rem;margin:3rem auto;padding:0 1.25rem;line-height:1.5}
      h1{font-size:1.5rem;font-weight:650;margin:0 0 .75rem}
      a{color:#b86a62}
      .btn{display:inline-block;margin-top:1rem;padding:.85rem 1.25rem;border-radius:.65rem;background:#1C1917;color:#F7F1EA;text-decoration:none;font-weight:600;border:0;cursor:pointer;font-size:1rem}
      .btn:disabled{opacity:.6;cursor:wait}
      .note{color:#6b5f56;font-size:.95rem}
      .err{color:#9b3b3b;margin-top:.75rem}
    </style>
  </head>
  <body>
    <h1>You’re on the list</h1>
    <p>Thanks for joining the Quillbench soft-launch waitlist. We’ll be in touch at the email you shared.</p>
    <p class="note">Ready now? Soft-launch Studio Bundle is <strong>$449</strong> USD (SOFTLAUNCH50 applied at Checkout).</p>
    <button class="btn" id="buy" type="button">Get Studio Bundle $449</button>
    <p id="err" class="err" hidden></p>
    <p style="margin-top:1.5rem"><a href="/">Back to Quillbench</a> · <a href="/pricing/bundle">Pricing</a></p>
    <script>
      (function () {
        var btn = document.getElementById("buy");
        var err = document.getElementById("err");
        btn.addEventListener("click", function () {
          err.hidden = true;
          btn.disabled = true;
          btn.textContent = "Opening checkout…";
          fetch("/.netlify/functions/create-checkout-session", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              packageId: "studio-bundle",
              successUrl: location.origin + "/?checkout=success&pkg=studio-bundle",
              cancelUrl: location.origin + "/waitlist?checkout=cancel",
            }),
          })
            .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
            .then(function (x) {
              if (x.ok && x.d && x.d.url) {
                location.assign(x.d.url);
                return;
              }
              btn.disabled = false;
              btn.textContent = "Get Studio Bundle $449";
              err.textContent = (x.d && (x.d.error || x.d.reason)) || "Checkout failed. Try again or email hello@quillbench.app.";
              err.hidden = false;
            })
            .catch(function () {
              btn.disabled = false;
              btn.textContent = "Get Studio Bundle $449";
              err.textContent = "Could not reach checkout. Check your connection.";
              err.hidden = false;
            });
        });
      })();
    </script>
  </body>
</html>
